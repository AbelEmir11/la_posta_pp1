<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Admin</title>
    <link rel="icon" href="imagenes/logo color.jpg" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .admin-sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
        }

        .admin-sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem 1.5rem;
            margin: 0.25rem 0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .admin-content {
            padding: 2rem;
            background: var(--bg-light);
            min-height: 100vh;
        }

        .product-image-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar (mismo que dashboard) -->
            <div class="col-md-3 col-lg-2 px-0 admin-sidebar">
                <div class="text-center mb-4">
                    <img src="imagenes/logo color.jpg" alt="Logo" class="rounded-circle"
                        style="width: 80px; height: 80px; object-fit: cover; border: 3px solid white;">
                    <h5 class="mt-3">Panel Admin</h5>
                    <p class="small" id="adminName">Administrador</p>
                </div>

                <nav class="nav flex-column px-3">
                    <a class="nav-link" href="admin-dashboard.html">
                        <i class="fas fa-chart-line me-2"></i> Dashboard
                    </a>
                    <a class="nav-link active" href="admin-products.html">
                        <i class="fas fa-box me-2"></i> Productos
                    </a>
                    <a class="nav-link" href="admin-orders.html">
                        <i class="fas fa-shopping-bag me-2"></i> Pedidos
                    </a>
                    <a class="nav-link" href="admin-customers.html">
                        <i class="fas fa-users me-2"></i> Clientes
                    </a>
                    <a class="nav-link" href="admin-contacts.html">
                        <i class="fas fa-envelope me-2"></i> Mensajes
                    </a>

                    <hr class="my-3" style="border-color: rgba(255,255,255,0.3);">

                    <a class="nav-link" href="index.html">
                        <i class="fas fa-home me-2"></i> Ir al sitio
                    </a>
                    <a class="nav-link" href="#" onclick="logout(); return false;">
                        <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 admin-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-box text-primary"></i> Gestión de Productos</h2>
                    <button class="btn btn-primary" id="btnNewProduct">
                        <i class="fas fa-plus"></i> Nuevo Producto
                    </button>
                </div>

                <!-- Tabla de productos -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Imagen</th>
                                        <th>Nombre</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTable">
                                    <tr>
                                        <td colspan="7" class="text-center">
                                            <i class="fas fa-spinner fa-spin"></i> Cargando productos...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Producto -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productName" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="productName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productCategory" class="form-label">Categoría *</label>
                                <select class="form-select" id="productCategory" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="conservas">Conservas</option>
                                    <option value="artesanias">Artesanías</option>
                                    <option value="cuidado_personal">Cuidado Personal</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="productDescription" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productPrice" class="form-label">Precio *</label>
                                <input type="number" class="form-control" id="productPrice" step="0.01" min="0"
                                    required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productStock" class="form-label">Stock *</label>
                                <input type="number" class="form-control" id="productStock" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productImage" class="form-label">Imagen (nombre del archivo)</label>
                            <input type="text" class="form-control" id="productImage" placeholder="ejemplo.jpg">
                            <small class="text-muted">Nombre del archivo de imagen en la carpeta imagenes/</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveProduct()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>

    <script>
        // API_URL ya está definido en auth.js
        let productModal;

        // Proteger página
        if (!requireAdmin()) { }

        // Cargar nombre del admin
        const user = getUserFromStorage();
        if (user) {
            document.getElementById('adminName').textContent = user.nombre;
        }

        // Inicializar modal
        document.addEventListener('DOMContentLoaded', () => {
            productModal = new bootstrap.Modal(document.getElementById('productModal'));
            loadProducts();

            // Event listener para botón nuevo producto
            document.getElementById('btnNewProduct').addEventListener('click', showCreateProductModal);
        });

        // Cargar productos
        async function loadProducts() {
            try {
                const response = await authenticatedFetch(`${API_URL}/admin/products`);
                const products = await response.json();

                const tbody = document.getElementById('productsTable');

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay productos</td></tr>';
                    return;
                }

                tbody.innerHTML = products.map(product => `
                    <tr>
                        <td>${product.id}</td>
                        <td>
                            ${product.imagen ? `<img src="imagenes/${product.imagen}" class="product-image-preview" alt="${product.nombre}">` : '<i class="fas fa-image text-muted"></i>'}
                        </td>
                        <td><strong>${product.nombre}</strong></td>
                        <td><span class="badge bg-secondary">${getCategoryName(product.categoria)}</span></td>
                        <td>$${product.precio.toFixed(2)}</td>
                        <td>${product.stock}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick='editProduct(${JSON.stringify(product)})'>
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${product.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productsTable').innerHTML =
                    '<tr><td colspan="7" class="text-center text-danger">Error al cargar productos</td></tr>';
            }
        }

        // Mostrar modal crear
        function showCreateProductModal() {
            document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            productModal.show();
        }

        // Editar producto
        function editProduct(product) {
            document.getElementById('productModalTitle').textContent = 'Editar Producto';
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.nombre;
            document.getElementById('productCategory').value = product.categoria;
            document.getElementById('productDescription').value = product.descripcion || '';
            document.getElementById('productPrice').value = product.precio;
            document.getElementById('productStock').value = product.stock;
            document.getElementById('productImage').value = product.imagen || '';
            productModal.show();
        }

        // Guardar producto
        async function saveProduct() {
            const id = document.getElementById('productId').value;
            const data = {
                nombre: document.getElementById('productName').value,
                categoria: document.getElementById('productCategory').value,
                descripcion: document.getElementById('productDescription').value,
                precio: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                imagen: document.getElementById('productImage').value
            };

            console.log('Guardando producto:', data);

            try {
                const url = id ? `${API_URL}/admin/products/${id}` : `${API_URL}/admin/products`;
                const method = id ? 'PUT' : 'POST';

                console.log('URL:', url, 'Method:', method);

                const response = await authenticatedFetch(url, {
                    method,
                    body: JSON.stringify(data)
                });

                console.log('Response status:', response.status);

                if (response.ok) {
                    const result = await response.json();
                    console.log('Producto guardado exitosamente:', result);

                    // Mostrar alerta y SOLO cerrar modal cuando el usuario haga clic en OK
                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: id ? 'Producto actualizado correctamente' : 'Producto creado correctamente',
                        confirmButtonText: 'OK',
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        showConfirmButton: true
                    }).then((result) => {
                        if (result.isConfirmed) {
                            productModal.hide();
                            loadProducts();
                        }
                    });
                } else {
                    const errorData = await response.json();
                    console.error('Error del servidor:', errorData);
                    throw new Error(errorData.error || errorData.message || 'Error al guardar');
                }
            } catch (error) {
                console.error('Error completo:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'No se pudo guardar el producto',
                    confirmButtonText: 'OK'
                }).then(() => {
                    // Solo cerrar modal y recargar después de que el usuario confirme
                    productModal.hide();
                    loadProducts();
                });
            }
        }

        // Eliminar producto
        async function deleteProduct(id) {
            const result = await Swal.fire({
                title: '¿Eliminar producto?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                try {
                    const response = await authenticatedFetch(`${API_URL}/admin/products/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        Swal.fire('¡Eliminado!', 'El producto ha sido eliminado', 'success');
                        loadProducts();
                    }
                } catch (error) {
                    Swal.fire('Error', 'No se pudo eliminar el producto', 'error');
                }
            }
        }

        // Obtener nombre de categoría
        function getCategoryName(categoria) {
            const names = {
                'conservas': 'Conservas',
                'artesanias': 'Artesanías',
                'cuidado_personal': 'Cuidado Personal'
            };
            return names[categoria] || categoria;
        }
    </script>
</body>

</html>
