<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Admin</title>
    <link rel="icon" href="imagenes/logo color.jpg" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .admin-sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
        }

        .admin-sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem 1.5rem;
            margin: 0.25rem 0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .admin-content {
            padding: 2rem;
            background: var(--bg-light);
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 admin-sidebar">
                <div class="text-center mb-4">
                    <img src="imagenes/logo color.jpg" alt="Logo" class="rounded-circle"
                        style="width: 80px; height: 80px; object-fit: cover; border: 3px solid white;">
                    <h5 class="mt-3">Panel Admin</h5>
                    <p class="small" id="adminName">Administrador</p>
                </div>

                <nav class="nav flex-column px-3">
                    <a class="nav-link" href="admin-dashboard.html">
                        <i class="fas fa-chart-line me-2"></i> Dashboard
                    </a>
                    <a class="nav-link" href="admin-products.html">
                        <i class="fas fa-box me-2"></i> Productos
                    </a>
                    <a class="nav-link" href="admin-orders.html">
                        <i class="fas fa-shopping-bag me-2"></i> Pedidos
                    </a>
                    <a class="nav-link active" href="admin-customers.html">
                        <i class="fas fa-users me-2"></i> Clientes
                    </a>
                    <a class="nav-link" href="admin-contacts.html">
                        <i class="fas fa-envelope me-2"></i> Mensajes
                    </a>

                    <hr class="my-3" style="border-color: rgba(255,255,255,0.3);">

                    <a class="nav-link" href="index.html">
                        <i class="fas fa-home me-2"></i> Ir al sitio
                    </a>
                    <a class="nav-link" href="#" onclick="logout(); return false;">
                        <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 admin-content">
                <h2 class="mb-4"><i class="fas fa-users text-primary"></i> Clientes Registrados</h2>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Teléfono</th>
                                        <th>Dirección</th>
                                        <th>Fecha Registro</th>
                                    </tr>
                                </thead>
                                <tbody id="customersTable">
                                    <tr>
                                        <td colspan="6" class="text-center">
                                            <i class="fas fa-spinner fa-spin"></i> Cargando clientes...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>

    <script>
        // API_URL ya está definido en auth.js

        if (!requireAdmin()) { }

        const user = getUserFromStorage();
        if (user) {
            document.getElementById('adminName').textContent = user.nombre;
        }

        async function loadCustomers() {
            try {
                const response = await authenticatedFetch(`${API_URL}/admin/customers`);
                const customers = await response.json();

                const tbody = document.getElementById('customersTable');

                if (customers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No hay clientes registrados</td></tr>';
                    return;
                }

                tbody.innerHTML = customers.map(customer => `
                    <tr>
                        <td>${customer.id}</td>
                        <td><strong>${customer.nombre}</strong></td>
                        <td>${customer.email}</td>
                        <td>${customer.telefono || '-'}</td>
                        <td>${customer.direccion || '-'}</td>
                        <td>${new Date(customer.created_at).toLocaleDateString('es-AR')}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('customersTable').innerHTML =
                    '<tr><td colspan="6" class="text-center text-danger">Error al cargar clientes</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>

</html>
