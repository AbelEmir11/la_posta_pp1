<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Admin</title>
    <link rel="icon" href="imagenes/logo color.jpg" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .admin-sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
        }

        .admin-sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem 1.5rem;
            margin: 0.25rem 0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .admin-content {
            padding: 2rem;
            background: var(--bg-light);
            min-height: 100vh;
        }

        .message-card {
            border-left: 4px solid var(--primary-color);
        }

        .message-card.unread {
            background-color: #f0f8ff;
            border-left-color: #ff6b6b;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 admin-sidebar">
                <div class="text-center mb-4">
                    <img src="imagenes/logo color.jpg" alt="Logo" class="rounded-circle"
                        style="width: 80px; height: 80px; object-fit: cover; border: 3px solid white;">
                    <h5 class="mt-3">Panel Admin</h5>
                    <p class="small" id="adminName">Administrador</p>
                </div>

                <nav class="nav flex-column px-3">
                    <a class="nav-link" href="admin-dashboard.html">
                        <i class="fas fa-chart-line me-2"></i> Dashboard
                    </a>
                    <a class="nav-link" href="admin-products.html">
                        <i class="fas fa-box me-2"></i> Productos
                    </a>
                    <a class="nav-link" href="admin-orders.html">
                        <i class="fas fa-shopping-bag me-2"></i> Pedidos
                    </a>
                    <a class="nav-link" href="admin-customers.html">
                        <i class="fas fa-users me-2"></i> Clientes
                    </a>
                    <a class="nav-link active" href="admin-contacts.html">
                        <i class="fas fa-envelope me-2"></i> Mensajes
                    </a>

                    <hr class="my-3" style="border-color: rgba(255,255,255,0.3);">

                    <a class="nav-link" href="index.html">
                        <i class="fas fa-home me-2"></i> Ir al sitio
                    </a>
                    <a class="nav-link" href="#" onclick="logout(); return false;">
                        <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 admin-content">
                <h2 class="mb-4"><i class="fas fa-envelope text-primary"></i> Mensajes de Contacto</h2>

                <div id="messagesContainer">
                    <div class="text-center py-5">
                        <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                        <p class="mt-3">Cargando mensajes...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>

    <script>
        // API_URL ya está definido en auth.js

        if (!requireAdmin()) { }

        const user = getUserFromStorage();
        if (user) {
            document.getElementById('adminName').textContent = user.nombre;
        }

        async function loadMessages() {
            try {
                const response = await authenticatedFetch(`${API_URL}/admin/contacts`);
                const messages = await response.json();

                const container = document.getElementById('messagesContainer');

                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-envelope fa-3x text-muted"></i>
                            <p class="mt-3 text-muted">No hay mensajes</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = messages.map(message => `
                    <div class="card message-card ${message.leido ? '' : 'unread'} mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h5 class="mb-1">
                                        ${message.nombre}
                                        ${!message.leido ? '<span class="badge bg-danger ms-2">Nuevo</span>' : ''}
                                    </h5>
                                    <p class="text-muted mb-0">
                                        <i class="fas fa-envelope"></i> ${message.email}
                                    </p>
                                </div>
                                <small class="text-muted">
                                    ${new Date(message.created_at).toLocaleString('es-AR')}
                                </small>
                            </div>
                            <hr>
                            <p class="mb-3">${message.mensaje}</p>
                            ${!message.leido ? `
                                <button class="btn btn-sm btn-outline-primary" onclick="markAsRead(${message.id})">
                                    <i class="fas fa-check"></i> Marcar como leído
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error al cargar mensajes
                    </div>
                `;
            }
        }

        async function markAsRead(messageId) {
            try {
                const response = await authenticatedFetch(`${API_URL}/admin/contacts/${messageId}/read`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Marcado como leído',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    loadMessages();
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo marcar como leído'
                });
            }
        }

        document.addEventListener('DOMContentLoaded', loadMessages);
    </script>
</body>

</html>
